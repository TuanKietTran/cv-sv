name: Production check

# Runs read-only checks against the live production deployment, 5 minutes
# after Deno Deploy reports the current `main` commit as successfully built.
# Deno's GitHub integration posts a commit status (context below); that
# status is the trigger, so nothing here polls Deno or needs its credentials.
#
# Repository variables (Settings → Secrets and variables → Actions → Variables):
#   PRODUCTION_URL               production origin, default https://ruxt.mashallow.deno.net
#   DENO_DEPLOY_STATUS_CONTEXT   Deno's commit status context, default deploy/mashallow/ruxt

on:
    status:
    workflow_dispatch:
        inputs:
            wait_minutes:
                description: Minutes to wait before testing
                default: "0"

concurrency:
    # A newer production deployment supersedes a pending check.
    group: production-check
    cancel-in-progress: true

env:
    PRODUCTION_URL: ${{ vars.PRODUCTION_URL || 'https://ruxt.mashallow.deno.net' }}

jobs:
    check:
        name: Check production
        # Only main: a successful Deno build status on a commit main contains,
        # or a manual run started from main.
        if: >-
            (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
            (github.event_name == 'status' &&
             github.event.state == 'success' &&
             github.event.context == (vars.DENO_DEPLOY_STATUS_CONTEXT || 'deploy/mashallow/ruxt') &&
             contains(github.event.branches.*.name, 'main'))
        runs-on: ubuntu-latest
        timeout-minutes: 30

        permissions:
            contents: read

        steps:
            - name: Resolve commit
              id: target
              env:
                  EVENT_SHA: ${{ github.event.sha }}
                  GH_TOKEN: ${{ github.token }}
              run: |
                  main_sha="$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha)"
                  sha="${EVENT_SHA:-$main_sha}"
                  # The status may belong to an older commit that main merely
                  # contains; only the current main head is in production.
                  if [ "$sha" != "$main_sha" ]; then
                      echo "::notice::Skipping ${sha}: main is at ${main_sha}."
                      echo "skip=true" >> "$GITHUB_OUTPUT"
                  else
                      echo "skip=false" >> "$GITHUB_OUTPUT"
                  fi
                  echo "sha=${sha}" >> "$GITHUB_OUTPUT"

            - name: Let the deployment settle
              if: steps.target.outputs.skip == 'false'
              env:
                  WAIT_MINUTES: ${{ github.event_name == 'status' && '5' || inputs.wait_minutes }}
              run: sleep "$(( ${WAIT_MINUTES:-0} * 60 ))"

            - name: Wait for production to answer
              if: steps.target.outputs.skip == 'false'
              run: |
                  for attempt in $(seq 1 30); do
                      if curl -fsS --max-time 10 "${PRODUCTION_URL}/api/health"; then
                          echo; exit 0
                      fi
                      sleep 10
                  done
                  echo "::error::${PRODUCTION_URL}/api/health did not return 200 within 5 minutes."
                  exit 1

            - uses: actions/checkout@v4
              if: steps.target.outputs.skip == 'false'
              with:
                  ref: ${{ steps.target.outputs.sha }}

            - uses: pnpm/action-setup@v4
              if: steps.target.outputs.skip == 'false'
              with:
                  version: 11.25.0

            - uses: actions/setup-node@v4
              if: steps.target.outputs.skip == 'false'
              with:
                  node-version: 22
                  cache: pnpm

            - name: Install dependencies
              if: steps.target.outputs.skip == 'false'
              run: pnpm install --frozen-lockfile

            - name: Run production checks
              if: steps.target.outputs.skip == 'false'
              env:
                  PRODUCTION_BASE_URL: ${{ env.PRODUCTION_URL }}
                  # Preinstalled on ubuntu-latest; playwright-core never downloads a browser.
                  CHROMIUM_PATH: /usr/bin/google-chrome
              run: pnpm test:production --reporter=default

            - name: Upload screenshots
              if: always() && steps.target.outputs.skip == 'false'
              uses: actions/upload-artifact@v4
              with:
                  name: production-screenshots-${{ steps.target.outputs.sha }}
                  path: test-results/production
                  if-no-files-found: ignore
                  retention-days: 14
